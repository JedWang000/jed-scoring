name: Verify extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install test Chromium
        run: npx playwright install chromium
      - name: Verify source and packaged extension
        run: npm run verify:package
      - name: Include license notices
        run: Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist
      - name: Upload verified extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jed-scoring-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
